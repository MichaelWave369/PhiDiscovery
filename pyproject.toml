[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phidiscovery"
version = "0.2.0"
description = "Offline-first, auditable, domain-independent scientific discovery triage"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
authors = [{name = "PHI369 Labs"}]

[project.optional-dependencies]
provenance = ["cryptography>=42,<48"]

[project.scripts]
phi-discovery = "phidiscovery.cli:main"

[tool.setuptools.packages.find]
include = ["phidiscovery*"]
