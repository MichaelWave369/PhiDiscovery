name: PhiDiscovery Verification
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional signed-provenance verifier for R0.9 tests
        run: python -m pip install ".[provenance]"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Exercise pilot and check deterministic receipt
        run: |
          python -m phidiscovery run examples/cannabinoid-pilot.json --out pilot-out
          python -m phidiscovery check examples/cannabinoid-pilot.json pilot-out/report.json
      - name: Exercise generic domain and offline spectrum adapter
        run: |
          python -m phidiscovery run examples/geology-pilot.json --out geology-out
          python -m phidiscovery spectra examples/demo-spectra.mgf --library examples/demo-reference-spectra.json --out pilot-out/spectra-results.json

      - name: Exercise offline MassBank reference import
        run: |
          python -m phidiscovery massbank-import tests/fixtures/synthetic-massbank.txt --out pilot-out/massbank-reference.json
          test -s pilot-out/massbank-reference.json

      - name: Exercise offline quantum brain models
        run: |
          python -m phidiscovery quantum-brain --out pilot-out/brain
          test -s pilot-out/brain/quantum-brain.json
          test -s pilot-out/brain/quantum-brain.html

      - name: Exercise offline Assumption Challenger
        run: |
          python -m phidiscovery challenge examples/assumption-challenge.json --out pilot-out/assumptions.json
          python -c "import json; r=json.load(open('pilot-out/assumptions.json')); assert r['counts']['candidates']==2; assert r['candidates'][0]['evidence_index']['eligible_support_ids']==[]"

      - name: Export blind reviewer packets without inference
        run: |
          python -m phidiscovery review-pack examples/assumption-challenge.json --out pilot-out/review-packets.json
          python -c "import json; p=json.load(open('pilot-out/review-packets.json')); assert len(p['packets'])==6"

      - name: Validate offline Agentora bridge contracts (never contacts Agentora)
        run: |
          python -m unittest tests.test_agentora_bridge -v

      - name: Exercise sealed debate and revision ledger without model inference
        run: |
          python -m unittest tests.test_debate -v

      - name: Lock and score toy predictions against isolated synthetic holdout (offline)
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery predict-register examples/prediction-plan-r05.json --out "$TEMP_DIR/prediction-lock.json"
          python -m phidiscovery predict-check examples/prediction-plan-r05.json "$TEMP_DIR/prediction-lock.json"
          python -m phidiscovery predict-score examples/prediction-plan-r05.json "$TEMP_DIR/prediction-lock.json" examples/synthetic-holdout-r05.json --out "$TEMP_DIR/prediction-score.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['synthetic_holdout'] and not r['hypothesis_validated']; assert r['lowest_mae_model_ids_descriptive_only']==['nonlinear']" "$TEMP_DIR/prediction-score.json"

      - name: Score fictional repeated trials and check leakage flags (offline)
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery predict-register examples/prediction-plan-r05.json --out "$TEMP_DIR/lock.json"
          python -m phidiscovery replicate-score examples/prediction-plan-r05.json "$TEMP_DIR/lock.json" examples/synthetic-replicates-r06.json --out "$TEMP_DIR/repeated-score.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['counts']['trials']==9 and r['counts']['targets']==3 and r['leakage_audit']['synthetic_data'] and not r['hypothesis_validated']" "$TEMP_DIR/repeated-score.json"

      - name: Detect planted synthetic training/holdout overlap in manifests (offline)
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery predict-register examples/prediction-plan-r05.json --out "$TEMP_DIR/lock.json"
          python -m phidiscovery manifest-audit examples/prediction-plan-r05.json "$TEMP_DIR/lock.json" examples/synthetic-replicates-r06.json examples/synthetic-manifest-r07.json --out "$TEMP_DIR/audit.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['manifest_status']=='EXACT_IDENTIFIER_OVERLAP_DECLARED' and r['ranking_suppressed'] and not r['hypothesis_validated']; assert r['descriptive_r06_diagnostics']['descriptive_leaders_if_not_quarantined'] is None" "$TEMP_DIR/audit.json"

      - name: Detect renamed synthetic training/holdout content and quarantine (offline)
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery predict-register examples/prediction-plan-r05.json --out "$TEMP_DIR/lock.json"
          python -m phidiscovery content-audit examples/prediction-plan-r05.json "$TEMP_DIR/lock.json" examples/synthetic-replicates-r06.json examples/synthetic-manifest-r08.json examples/synthetic-content-index-r08.json --out "$TEMP_DIR/content-audit.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); m={x['model_id']:x for x in r['models']}; assert r['status']=='EXACT_CONTENT_OVERLAP_IN_SUPPLIED_RECORDS' and r['ranking_suppressed'] and not r['hypothesis_validated']; assert m['nonlinear']['exact_content_matched_holdout_trial_count']==1 and m['nonlinear']['whitespace_candidate_trial_count']==1" "$TEMP_DIR/content-audit.json"

      - name: Verify two fictional Ed25519 signatures with independently unverified clock
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery predict-register examples/prediction-plan-r05.json --out "$TEMP_DIR/lock.json"
          python -m phidiscovery anchor-draft "$TEMP_DIR/lock.json" --out "$TEMP_DIR/publisher-claim.json"
          python examples/demo_signed_anchor_r09.py "$TEMP_DIR/lock.json" --out-dir "$TEMP_DIR"
          python -m phidiscovery anchor-verify "$TEMP_DIR/lock.json" "$TEMP_DIR/demo-anchor.json" "$TEMP_DIR/demo-trust.json" --out "$TEMP_DIR/verification.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['publisher_ed25519_signature_valid'] and r['witness_ed25519_signature_valid'] and not r['independent_timestamp_authority_verified'] and not r['witness_actual_time_verified'] and not r['hypothesis_validated']" "$TEMP_DIR/verification.json"

      - name: Verify synthetic signed Merkle log inclusion without trusting the timestamp
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery predict-register examples/prediction-plan-r05.json --out "$TEMP_DIR/lock.json"
          python examples/demo_signed_anchor_r09.py "$TEMP_DIR/lock.json" --out-dir "$TEMP_DIR"
          python examples/demo_log_inclusion_r10.py "$TEMP_DIR/lock.json" "$TEMP_DIR/demo-anchor.json" "$TEMP_DIR/demo-trust.json" --out-dir "$TEMP_DIR"
          python -m phidiscovery log-verify "$TEMP_DIR/lock.json" "$TEMP_DIR/demo-anchor.json" "$TEMP_DIR/demo-trust.json" "$TEMP_DIR/demo-log-proof.json" "$TEMP_DIR/demo-log-trust.json" --out "$TEMP_DIR/verification.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['merkle_inclusion_valid'] and r['log_checkpoint_signature_valid'] and r['publisher_witness_signatures_valid']; assert not r['external_time_source_verified'] and not r['append_only_consistency_verified'] and not r['hypothesis_validated']" "$TEMP_DIR/verification.json"

      - name: Verify synthetic signed Merkle consistency between two checkpoints
        run: |
          TEMP_DIR="$(mktemp -d)"
          python examples/demo_log_consistency_r11.py --out-dir "$TEMP_DIR"
          python -m phidiscovery log-consistency "$TEMP_DIR/demo-r11-older.json" "$TEMP_DIR/demo-r11-newer.json" "$TEMP_DIR/demo-r11-proof.json" "$TEMP_DIR/demo-r11-log-trust.json" --out "$TEMP_DIR/report.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert r['signed_checkpoints_valid'] and r['merkle_consistency_valid'] and r['tree_growth_proven']; assert not r['older_checkpoint_independently_retained_verified'] and not r['external_time_verified'] and not r['cross_client_non_equivocation_verified'] and not r['hypothesis_validated']" "$TEMP_DIR/report.json"


      - name: R0.2 check offline synthetic cross-machine calibration and negative controls
        run: |
          TEMP_DIR="$(mktemp -d)"
          python -m phidiscovery.checkpoint_calibration demo --out "$TEMP_DIR/calibration-demo.json"
          python -c "import json,sys; r=json.load(open(sys.argv[1])); s=r['same_simulated_layout']; d=r['different_simulated_layout']; assert s['descriptive_summary']['all_cross_machine_values_bit_identical']; assert not d['descriptive_summary']['all_cross_machine_values_bit_identical']; assert not s['hardware_identity_verified'] and not d['actual_training_hardware_verified']; assert s['evidence_class']=='SYNTHETIC_DEMO_ONLY'" "$TEMP_DIR/calibration-demo.json"
          python -m unittest discover -s tests -p 'test_checkpoint_calibration.py' -v
